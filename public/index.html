<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Encuesta para Personas Ciegas (Voz)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main>
    <h1 id="title">Encuesta por voz</h1>
    <p id="intro">Presione Enter para comenzar la entrevista. Use auriculares si es posible.</p>

    <div id="controls">
      <button id="startBtn">Comenzar entrevista</button>
      <button id="repeatBtn">Repetir última pregunta</button>
      <button id="skipBtn">Saltar pregunta</button>
    </div>

    <div id="voiceControl" aria-label="Seleccionar voz">
      <label for="voiceSelect">Seleccionar voz:</label>
      <select id="voiceSelect" aria-label="Seleccionar voz"></select>
    </div>

    <fieldset id="ttsControls" aria-label="Controles de voz" style="margin-top:12px">
      <legend>Controles de voz</legend>
      <label for="rateRange">Velocidad (rate): <span id="rateValue">0.95</span></label>
      <input id="rateRange" type="range" min="0.6" max="1.4" step="0.05" value="0.95" />
      <br/>
      <label for="pitchRange">Tono (pitch): <span id="pitchValue">1.12</span></label>
      <input id="pitchRange" type="range" min="0.8" max="1.4" step="0.05" value="1.12" />
    </fieldset>

    <div id="status" aria-live="polite"></div>

    <section id="transcript" aria-label="Transcripción y respuestas">
      <h2>Transcripción</h2>
      <div id="log"></div>
    </section>

    <!-- Fallback input for browsers without SpeechRecognition -->
    <div id="fallbackModal" role="dialog" aria-modal="true" aria-hidden="true" class="modal">
      <div class="modal-content">
        <label id="fallbackLabel" for="fallbackInput">Escriba su respuesta y presione Enviar</label>
        <input id="fallbackInput" aria-labelledby="fallbackLabel" />
        <div class="modal-actions">
          <button id="fallbackSubmit">Enviar</button>
          <button id="fallbackCancel">Cancelar</button>
        </div>
      </div>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
